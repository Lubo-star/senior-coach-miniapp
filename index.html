<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Senior Coach</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f8f7;
    color: #263238;
    font-size: 20px;
}

.container {
    max-width: 720px;
    margin: 30px auto;
    padding: 25px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 3px 14px rgba(0,0,0,0.08);
}

h1 {
    font-size: 34px;
    margin-top: 0;
}

.intro {
    line-height: 1.6;
}

h2 {
    margin-top: 30px;
    font-size: 25px;
}

.choice {
    display: block;
    width: 100%;
    margin: 14px 0;
    padding: 18px;
    border: none;
    border-radius: 12px;
    background: #168c83;
    color: white;
    font-size: 21px;
    cursor: pointer;
}

.choice:hover {
    background: #11766f;
}

.answer {
    margin-top: 22px;
    padding: 20px;
    background: #eef7f6;
    border-radius: 12px;
    line-height: 1.5;
    min-height: 30px;
}

.question-box {
    margin-top: 32px;
    padding-top: 25px;
    border-top: 2px solid #e5eeee;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 12px;
}

textarea {
    box-sizing: border-box;
    width: 100%;
    min-height: 110px;
    padding: 15px;
    border: 2px solid #9eafad;
    border-radius: 12px;
    font-family: Arial, sans-serif;
    font-size: 20px;
    resize: vertical;
}

.send {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 18px;
    border: none;
    border-radius: 12px;
    background: #245b88;
    color: white;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}

.send:hover {
    background: #1c496e;
}

footer {
    text-align: center;
    margin-top: 25px;
    color: #667;
    font-size: 16px;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>Dobrý den 👋</h1>

<p class="intro">
Jsem <strong>Senior Coach</strong>. Můžete si se mnou povídat,
hledat informace nebo získat jednoduchou pomoc při každodenních situacích.
</p>

<h2>S čím vám dnes mohu pomoci?</h2>

<button class="choice" onclick="showAnswer('chat')">
💬 Chci si popovídat
</button>

<button class="choice" onclick="showAnswer('help')">
💛 Potřebuji poradit
</button>

<button class="choice" onclick="showAnswer('learn')">
📚 Chci se něco naučit
</button>

<button class="choice" onclick="showAnswer('family')">
❤️ Rodina a každodenní život
</button>

<div id="answer" class="answer">
Vyberte jednu z možností nebo mi napište vlastní otázku.
</div>

<div class="question-box">

<label for="question">
Nebo mi napište vlastní otázku:
</label>

<textarea
id="question"
placeholder="Například: Jak si zvětším písmo v telefonu?">
</textarea>

<button class="send" onclick="sendQuestion()">
Odeslat otázku
</button>

</div>

</div>

<footer>
Senior Coach • jednoduchá pomoc pro každý den
</footer>

</div>

<script>
function showAnswer(type) {

    const answer = document.getElementById("answer");

    if (type === "chat") {
        answer.innerHTML =
        "<strong>Jsem tady pro vás.</strong><p>Napište, o čem byste si dnes chtěli povídat.</p>";
    }

    if (type === "help") {
        answer.innerHTML =
        "<strong>Samozřejmě.</strong><p>Popište mi, s čím potřebujete pomoci, a zkusíme to společně krok za krokem.</p>";
    }

    if (type === "learn") {
        answer.innerHTML =
        "<strong>Co vás zajímá?</strong><p>Můžeme společně probrat například telefon, internet, cestování nebo běžné každodenní otázky.</p>";
    }

    if (type === "family") {
        answer.innerHTML =
        "<strong>Povídejte.</strong><p>Můžeme probrat rodinu, samotu, každodenní starosti nebo prostě to, co máte právě na mysli.</p>";
    }
}

function sendQuestion() {

    const question =
        document.getElementById("question").value.trim();

    const answer =
        document.getElementById("answer");

    if (question === "") {
        answer.innerHTML =
        "<strong>Napište mi prosím svou otázku.</strong>";
        return;
    }

    answer.innerHTML =
        "<strong>Vaše otázka:</strong><p>" +
        question +
        "</p><strong>Otázka byla přijata.</strong><p>V dalším kroku připojíme skutečného AI Senior Coache, který vám bude odpovídat.</p>";

    answer.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}
</script>

</body>
</html>
