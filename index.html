<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Senior Coach</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f8f7;
    color: #263238;
}

header {
    background: #28786f;
    color: white;
    padding: 28px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 36px;
}

header p {
    font-size: 19px;
    margin-bottom: 0;
}

main {
    max-width: 720px;
    margin: 30px auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.10);
}

.card h2 {
    color: #28786f;
    font-size: 26px;
}

.intro {
    font-size: 19px;
    line-height: 1.6;
}

.question {
    margin-top: 25px;
    font-size: 20px;
    font-weight: bold;
}

button {
    display: block;
    width: 100%;
    margin: 12px 0;
    padding: 17px;
    border: none;
    border-radius: 12px;
    background: #28786f;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    background: #1f625b;
}

#message {
    display: none;
    margin-top: 25px;
    padding: 20px;
    background: #e8f4f2;
    border-radius: 12px;
    font-size: 18px;
    line-height: 1.5;
}

footer {
    text-align: center;
    padding: 25px;
    color: #667;
}
</style>
</head>

<body>

<header>
    <h1>Senior Coach</h1>
    <p>Váš osobní průvodce pro každý den</p>
</header>

<main>

<div class="card">

<h2>Dobrý den 👋</h2>

<p class="intro">
Jsem Senior Coach. Můžete si se mnou povídat,
hledat informace nebo získat jednoduchou pomoc
při každodenních situacích.
</p>

<p class="question">
S čím vám dnes mohu pomoci?
</p>

<button onclick="answer('talk')">
💬 Chci si popovídat
</button>

<button onclick="answer('help')">
🤝 Potřebuji poradit
</button>

<button onclick="answer('learn')">
📚 Chci se něco naučit
</button>

<button onclick="answer('family')">
❤️ Rodina a každodenní život
</button>

<div id="message"></div>

</div>

</main>

<footer>
Senior Coach • jednoduchá pomoc pro každý den
</footer>

<script>

function answer(type) {

    const message = document.getElementById("message");
    message.style.display = "block";

    if (type === "talk") {
        message.innerHTML =
        "<strong>Jsem tady pro vás.</strong><br><br>Napište, o čem byste si dnes chtěli povídat.";
    }

    if (type === "help") {
        message.innerHTML =
        "<strong>Samozřejmě.</strong><br><br>Popište mi, s čím potřebujete pomoci, a zkusíme to společně krok za krokem.";
    }

    if (type === "learn") {
        message.innerHTML =
        "<strong>Co vás zajímá?</strong><br><br>Můžeme společně probrat například telefon, internet, cestování nebo běžné každodenní otázky.";
    }

    if (type === "family") {
        message.innerHTML =
        "<strong>Povídejte.</strong><br><br>Můžeme probrat rodinu, samotu, každodenní starosti nebo prostě to, co máte právě na mysli.";
    }
}

</script>

</body>
</html>
