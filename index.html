<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Senior Coach</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f8f7;
    color: #263238;
    font-size: 20px;
}

.container {
    max-width: 720px;
    margin: 40px auto;
    padding: 30px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
}

h1 {
    color: #178f87;
    font-size: 34px;
}

h2 {
    font-size: 24px;
}

button {
    display: block;
    width: 100%;
    padding: 18px;
    margin: 12px 0;
    border: none;
    border-radius: 12px;
    background: #24a9a0;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

button:hover {
    background: #188f87;
}

#answer {
    margin-top: 22px;
    padding: 20px;
    background: #eef6f5;
    border-radius: 12px;
}

textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 120px;
    padding: 15px;
    margin-top: 20px;
    border: 2px solid #b8cfcc;
    border-radius: 12px;
    font-size: 20px;
    font-family: Arial, sans-serif;
}

.send {
    background: #176d68;
}

.footer {
    text-align: center;
    margin-top: 30px;
    color: #687878;
    font-size: 16px;
}
</style>
</head>

<body>

<div class="container">

<h1>Dobrý den 👋</h1>

<p>
Jsem Senior Coach. Můžete si se mnou povídat,
hledat informace nebo získat jednoduchou pomoc
při každodenních situacích.
</p>

<h2>S čím vám dnes mohu pomoci?</h2>

<button onclick="choose('talk')">💬 Chci si popovídat</button>

<button onclick="choose('help')">🤝 Potřebuji poradit</button>

<button onclick="choose('learn')">📚 Chci se něco naučit</button>

<button onclick="choose('family')">❤️ Rodina a každodenní život</button>

<div id="answer">
<strong>Jsem tady pro vás.</strong>
<p>Můžete vybrat jednu z možností nebo napsat vlastní otázku.</p>
</div>

<textarea
id="question"
placeholder="Napište sem, co vás zajímá...">
</textarea>

<button class="send" onclick="sendQuestion()">
Odeslat otázku
</button>

<div class="footer">
Senior Coach • jednoduchá pomoc pro každý den
</div>

</div>

<script>

function choose(type) {

    const answer = document.getElementById("answer");

    if (type === "talk") {
        answer.innerHTML =
        "<strong>Rád si s vámi popovídám.</strong><p>Jaký jste měl dnes den?</p>";
    }

    if (type === "help") {
        answer.innerHTML =
        "<strong>Samozřejmě.</strong><p>Popište mi, s čím potřebujete pomoci.</p>";
    }

    if (type === "learn") {
        answer.innerHTML =
        "<strong>Co vás zajímá?</strong><p>Můžeme probrat například telefon, internet, cestování nebo běžné každodenní otázky.</p>";
    }

    if (type === "family") {
        answer.innerHTML =
        "<strong>Povídejte.</strong><p>Můžeme probrat rodinu, samotu, každodenní starosti nebo prostě to, co máte právě na mysli.</p>";
    }

}

function sendQuestion() {

    const question = document.getElementById("question").value.trim();
    const answer = document.getElementById("answer");

    if (question === "") {
        answer.innerHTML =
        "<strong>Napište mi prosím svou otázku.</strong>";
        return;
    }

    answer.innerHTML =
    "<strong>Vaše otázka:</strong><p>" +
    question +
    "</p><strong>Rozumím.</strong><p>Dalším krokem bude připojení skutečného AI Senior Coache, který vám na tuto otázku odpoví.</p>";

}

</script>

</body>
</html>
